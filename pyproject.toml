[project]
name = "dsu-cfcs"
version = "1.0.2"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.164.0",
  "starlette==1.10.0",
  "uvicorn==0.54.0",
  "psycopg==3.3.9",
  "psycopg-binary==3.3.9",
  "argon2-cffi==25.1.0",
  "argon2-cffi-bindings==26.1.0",
  "pydantic==2.14.3",
  "pydantic-core==2.50.4",
  "python-multipart==0.0.34",
  "openpyxl==3.1.5",
  "defusedxml==0.7.1",
  "reportlab==5.1.0",
  "pillow==13.0.0",
  "typing-extensions==4.16.0",
  "typing-inspection==0.4.5",
  "annotated-types==0.8.0",
  "annotated-doc==0.0.6",
  "anyio==4.16.0",
  "click==8.5.1",
  "h11==0.16.0",
  "et_xmlfile==2.0.0",
  "cffi==2.1.1",
  "pycparser==3.12",
  "charset-normalizer==3.5.2",
  "idna==3.20",
]

[tool.vercel]
entrypoint = "app:app"

# Only public UI files live under frontend/public; academic records are never static files.
[tool.vercel.fastapi.static]
cdn = true
exclude = false
